<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04070E"/>
      <stop offset="100%" stop-color="#080E1A"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="url(#bg)"/>
  <!-- Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A2742" stroke-width="0.3" opacity="0.4"/>
  </pattern>
  <rect width="1200" height="820" fill="url(#grid)"/>

  <!-- Title -->
  <text x="60" y="48" fill="#EDF2FA" font-size="24" font-weight="700" letter-spacing="-0.5">Member 360</text>
  <text x="222" y="48" fill="#3B82F6" font-size="24" font-weight="700" letter-spacing="-0.5">Agentic Experience Layer</text>
  <text x="60" y="68" fill="#3C5070" font-size="12" font-weight="400" letter-spacing="1">SYSTEM ARCHITECTURE · SELF-FUNDED HEALTH PLAN · DETERMINISTIC + RAG HYBRID</text>

  <!-- ═══════ LAYER 1: EXPERIENCE ═══════ -->
  <rect x="40" y="95" width="1120" height="140" rx="12" fill="url(#blueGrad)" stroke="#1A3058" stroke-width="1"/>
  <rect x="40" y="95" width="4" height="140" rx="2" fill="#3B82F6"/>
  <text x="60" y="118" fill="#EDF2FA" font-size="14" font-weight="700">Experience Layer</text>
  <text x="210" y="118" fill="#3B82F6" font-size="11" opacity="0.7">Member-Facing Interface</text>

  <!-- Component boxes -->
  <rect x="60" y="132" width="340" height="85" rx="8" fill="#0A1020" stroke="#151E35" stroke-width="1"/>
  <text x="80" y="155" fill="#EDF2FA" font-size="13" font-weight="600">💬  Agentic Chat UI</text>
  <text x="80" y="173" fill="#3B82F6" font-size="10" opacity="0.7">React / Streamlit</text>
  <text x="80" y="194" fill="#6580A5" font-size="10.5">Conversational interface with tool-call visualization,</text>
  <text x="80" y="208" fill="#6580A5" font-size="10.5">streaming responses, and actionable scripts</text>

  <rect x="430" y="132" width="340" height="85" rx="8" fill="#0A1020" stroke="#151E35" stroke-width="1"/>
  <text x="450" y="155" fill="#EDF2FA" font-size="13" font-weight="600">📊  Advocacy Dashboard</text>
  <text x="450" y="173" fill="#3B82F6" font-size="10" opacity="0.7">Streamlit Widgets</text>
  <text x="450" y="194" fill="#6580A5" font-size="10.5">The Why + The How + Reconciliation Reasoning</text>
  <text x="450" y="208" fill="#6580A5" font-size="10.5">with SBC citations and consistency badges</text>

  <rect x="800" y="132" width="340" height="85" rx="8" fill="#0A1020" stroke="#151E35" stroke-width="1"/>
  <text x="820" y="155" fill="#EDF2FA" font-size="13" font-weight="600">👤  Member Context</text>
  <text x="820" y="173" fill="#3B82F6" font-size="10" opacity="0.7">Real-Time State</text>
  <text x="820" y="194" fill="#6580A5" font-size="10.5">Accumulators, active claims, plan enrollment,</text>
  <text x="820" y="208" fill="#6580A5" font-size="10.5">deductible/OOP tracking, identity</text>

  <!-- Flow arrows Layer 1 → 2 -->
  <line x1="600" y1="237" x2="600" y2="272" stroke="#14B8A6" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <polygon points="596,270 600,278 604,270" fill="#14B8A6" opacity="0.5"/>
  <text x="510" y="260" fill="#14B8A6" font-size="9" opacity="0.6">Agent Responses · Structured Output</text>

  <!-- ═══════ LAYER 2: ORCHESTRATION ═══════ -->
  <rect x="40" y="280" width="1120" height="140" rx="12" fill="url(#tealGrad)" stroke="#134E4A" stroke-width="1"/>
  <rect x="40" y="280" width="4" height="140" rx="2" fill="#14B8A6"/>
  <text x="60" y="303" fill="#EDF2FA" font-size="14" font-weight="700">Orchestration Layer</text>
  <text x="244" y="303" fill="#14B8A6" font-size="11" opacity="0.7">Agentic Reasoning Engine</text>

  <rect x="60" y="317" width="340" height="85" rx="8" fill="#0A1020" stroke="#14B8A6" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Core badge -->
  <rect x="320" y="317" width="50" height="16" rx="3" fill="#14B8A6"/>
  <text x="331" y="328" fill="#fff" font-size="8" font-weight="700" letter-spacing="1">CORE</text>
  <text x="80" y="340" fill="#EDF2FA" font-size="13" font-weight="600">🧠  ReconciliationAgent</text>
  <text x="80" y="358" fill="#14B8A6" font-size="10" opacity="0.7">Python / LangChain</text>
  <text x="80" y="379" fill="#6580A5" font-size="10.5">5-step pipeline: Ingest → Lookup → RAG Retrieve</text>
  <text x="80" y="393" fill="#6580A5" font-size="10.5">→ Reason → Output · Anti-hallucination enforced</text>

  <rect x="430" y="317" width="340" height="85" rx="8" fill="#0A1020" stroke="#151E35" stroke-width="1"/>
  <text x="450" y="340" fill="#EDF2FA" font-size="13" font-weight="600">📄  EOB Parser</text>
  <text x="450" y="358" fill="#14B8A6" font-size="10" opacity="0.7">Regex / Structured Extract</text>
  <text x="450" y="379" fill="#6580A5" font-size="10.5">Ingests raw EOB text → typed EOBRecord object</text>
  <text x="450" y="393" fill="#6580A5" font-size="10.5">with validation and multi-format support</text>

  <rect x="800" y="317" width="340" height="85" rx="8" fill="#0A1020" stroke="#151E35" stroke-width="1"/>
  <text x="820" y="340" fill="#EDF2FA" font-size="13" font-weight="600">⚖️  Reasoning Engine</text>
  <text x="820" y="358" fill="#14B8A6" font-size="10" opacity="0.7">Rule-Based Logic</text>
  <text x="820" y="379" fill="#6580A5" font-size="10.5">ER exception checks, timeline validation,</text>
  <text x="820" y="393" fill="#6580A5" font-size="10.5">consistency scoring, action-owner routing</text>

  <!-- Flow arrows Layer 2 → 3 -->
  <line x1="600" y1="422" x2="600" y2="457" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <polygon points="596,455 600,463 604,455" fill="#F59E0B" opacity="0.5"/>
  <text x="490" y="445" fill="#F59E0B" font-size="9" opacity="0.6">Code Mapping · SBC Retrieval · Accumulators</text>

  <!-- ═══════ LAYER 3: DATA & RETRIEVAL ═══════ -->
  <rect x="40" y="465" width="1120" height="140" rx="12" fill="url(#amberGrad)" stroke="#713F12" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="40" y="465" width="4" height="140" rx="2" fill="#F59E0B"/>
  <text x="60" y="488" fill="#EDF2FA" font-size="14" font-weight="700">Data &amp; Retrieval Layer</text>
  <text x="255" y="488" fill="#F59E0B" font-size="11" opacity="0.7">Knowledge Infrastructure</text>

  <rect x="60" y="502" width="340" height="85" rx="8" fill="#0A1020" stroke="#151E35" stroke-width="1"/>
  <text x="80" y="525" fill="#EDF2FA" font-size="13" font-weight="600">🗂️  Denial Code Mapping</text>
  <text x="80" y="543" fill="#F59E0B" font-size="10" opacity="0.7">JSON / Deterministic</text>
  <text x="80" y="564" fill="#6580A5" font-size="10.5">CARC → plain-language, SBC reference, action</text>
  <text x="80" y="578" fill="#6580A5" font-size="10.5">owner, call script · Unknown codes rejected</text>

  <rect x="430" y="502" width="340" height="85" rx="8" fill="#0A1020" stroke="#151E35" stroke-width="1"/>
  <text x="450" y="525" fill="#EDF2FA" font-size="13" font-weight="600">🔍  SBC Vector Store</text>
  <text x="450" y="543" fill="#F59E0B" font-size="10" opacity="0.7">FAISS / HuggingFace</text>
  <text x="450" y="564" fill="#6580A5" font-size="10.5">all-MiniLM-L6-v2 embeddings, section-level</text>
  <text x="450" y="578" fill="#6580A5" font-size="10.5">retrieval with deterministic fallback</text>

  <rect x="800" y="502" width="340" height="85" rx="8" fill="#0A1020" stroke="#151E35" stroke-width="1"/>
  <text x="820" y="525" fill="#EDF2FA" font-size="13" font-weight="600">💰  Accumulator Store</text>
  <text x="820" y="543" fill="#F59E0B" font-size="10" opacity="0.7">Benefits Platform API</text>
  <text x="820" y="564" fill="#6580A5" font-size="10.5">Deductible, OOP max, coinsurance calcs,</text>
  <text x="820" y="578" fill="#6580A5" font-size="10.5">potential savings projections</text>

  <!-- Flow arrows Layer 3 → 4 -->
  <line x1="600" y1="607" x2="600" y2="642" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <polygon points="596,640 600,648 604,640" fill="#F43F5E" opacity="0.5"/>
  <text x="518" y="630" fill="#F43F5E" font-size="9" opacity="0.6">EOB Feed · Plan Documents</text>

  <!-- ═══════ LAYER 4: INTEGRATION ═══════ -->
  <rect x="40" y="650" width="1120" height="140" rx="12" fill="url(#roseGrad)" stroke="#881337" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="40" y="650" width="4" height="140" rx="2" fill="#F43F5E"/>
  <text x="60" y="673" fill="#EDF2FA" font-size="14" font-weight="700">Integration Layer</text>
  <text x="210" y="673" fill="#F43F5E" font-size="11" opacity="0.7">System of Record Boundary</text>

  <rect x="60" y="687" width="340" height="85" rx="8" fill="#0A1020" stroke="#F43F5E" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="320" y="687" width="50" height="16" rx="3" fill="#F43F5E"/>
  <text x="331" y="698" fill="#fff" font-size="8" font-weight="700" letter-spacing="1">CORE</text>
  <text x="80" y="710" fill="#EDF2FA" font-size="13" font-weight="600">🏛️  Adjudication Engine</text>
  <text x="80" y="728" fill="#F43F5E" font-size="10" opacity="0.7">System of Record</text>
  <text x="80" y="749" fill="#6580A5" font-size="10.5">Pay/deny determination · NCPDP transactions</text>
  <text x="80" y="763" fill="#6580A5" font-size="10.5">Member 360 reads only — NEVER writes back</text>

  <rect x="430" y="687" width="340" height="85" rx="8" fill="#0A1020" stroke="#151E35" stroke-width="1"/>
  <text x="450" y="710" fill="#EDF2FA" font-size="13" font-weight="600">📡  EOB Data Feed</text>
  <text x="450" y="728" fill="#F43F5E" font-size="10" opacity="0.7">Kafka / Batch ETL</text>
  <text x="450" y="749" fill="#6580A5" font-size="10.5">Real-time Kafka streaming + batch ingest</text>
  <text x="450" y="763" fill="#6580A5" font-size="10.5">for historical claims processing</text>

  <rect x="800" y="687" width="340" height="85" rx="8" fill="#0A1020" stroke="#151E35" stroke-width="1"/>
  <text x="820" y="710" fill="#EDF2FA" font-size="13" font-weight="600">📚  Plan Document Store</text>
  <text x="820" y="728" fill="#F43F5E" font-size="10" opacity="0.7">Document Management</text>
  <text x="820" y="749" fill="#6580A5" font-size="10.5">SBC, SPD, formularies, network files</text>
  <text x="820" y="763" fill="#6580A5" font-size="10.5">Source-of-truth for RAG pipeline</text>

  <!-- Bottom bar -->
  <text x="60" y="810" fill="#2E4060" font-size="10" letter-spacing="1.5">PYTHON · LANGCHAIN · FAISS · HUGGINGFACE · STREAMLIT · REACT · KAFKA</text>
  <text x="1060" y="810" fill="#2E4060" font-size="10" text-anchor="end">v0.1</text>
</svg>
